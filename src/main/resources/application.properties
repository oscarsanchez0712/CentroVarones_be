spring.application.name=CentroVarones
server.port=${PORT:8080}

# --- SQL Server (cambia con variables de entorno o edita los valores por defecto) ---
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:centro_varones};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Oscar121314!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA: crea/actualiza las tablas automáticamente ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Origen permitido (frontend Angular)
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}