spring:
  application:
    name: centro-varones-api
  datasource:
    url: ${DATABASE_URL:jdbc:sqlserver://localhost:1433;databaseName=CentroVarones2026;encrypt=true;trustServerCertificate=true}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
server:
  port: ${PORT:8085}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
